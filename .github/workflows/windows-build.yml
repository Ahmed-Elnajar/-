name: Windows pilot build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "launcher.py", "requirements.txt", "installer/**", ".github/workflows/windows-build.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onedir --name AdvertisingPrintERP --collect-all fastapi --collect-all sqlalchemy --collect-all uvicorn launcher.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer/AdvertisingPrintERP.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AdvertisingPrintERP-Windows-Setup
          path: installer/Output/AdvertisingPrintERP-Setup.exe
          if-no-files-found: error
          retention-days: 30
