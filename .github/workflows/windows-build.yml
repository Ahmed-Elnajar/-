name: Windows pilot build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "launcher.py", "requirements.txt", "installer/**", ".github/workflows/windows-build.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onedir --name AdvertisingPrintERP --collect-all fastapi --collect-all sqlalchemy --collect-all uvicorn launcher.py
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler ISCC.exe was not found." }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" installer/AdvertisingPrintERP.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer/Output/AdvertisingPrintERP-Setup.exe")) { throw "Installer output was not created." }
      - uses: actions/upload-artifact@v4
        with:
          name: AdvertisingPrintERP-Windows-Setup
          path: installer/Output/AdvertisingPrintERP-Setup.exe
          if-no-files-found: error
          retention-days: 30
